services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dockscope-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dockscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockscope_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dockscope}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dockscope_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockscope} -d ${POSTGRES_DB:-dockscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: No unnecessary public database port exposure

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dockscope-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-dockscope-insecure-dev-secret-key-change-in-production-min32bytes}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dockscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockscope_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dockscope}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dockscope}:${POSTGRES_PASSWORD:-dockscope_secure_password}@db:5432/${POSTGRES_DB:-dockscope}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dockscope_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Vue 3 Frontend SPA
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dockscope-frontend
    restart: unless-stopped
    networks:
      - dockscope_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Unified Ingress)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine-slim
    container_name: dockscope-nginx
    restart: unless-stopped
    ports:
      - "${DOCKSCOPE_PORT:-3000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - dockscope_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: dockscope_postgres_data

networks:
  dockscope_net:
    name: dockscope_internal_net
    driver: bridge
